# Debian Server - VirtualCorp
# Delegacion 05

# Idioma y teclado
d-i debian-installer/locale string es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es

# Red por DHCP
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server
d-i netcfg/get_domain string virtualcorp.local

# Configuracion horaria
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

# Repositorios
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Paquetes

# Paquetes necesarios para administrar Debian
d-i pkgsel/include string openssh-server sudo ca-certificates lxqt-core sddm falkon
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Particionado automatico del disco virtual
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# Seleccionar el primer disco virtual
d-i partman-auto/disk string /dev/sda

# Confirmar el particionado sin preguntas
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# No utilizar LVM
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# Configuracion de usuarios

# Desactivar el acceso directo de root
d-i passwd/root-login boolean false

# Crear el usuario sysadmin
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Sysadmin
d-i passwd/username string sysadmin

# El hash se incorporara automaticamente
# al generar la instalacion desatendida

# Configurar SSH al finalizar la instalacion
d-i preseed/late_command string \
    install -m 600 /cdrom/files/authorized_keys /target/root/authorized_keys; \
    install -m 755 /cdrom/files/setup_ssh.sh /target/root/setup_ssh.sh; \
    in-target /bin/bash /root/setup_ssh.sh

# Instalacion automatica de GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# Evitar preguntas al finalizar
d-i cdrom-detect/eject boolean false

# Apagar al terminar la instalacion

# Instalacion ligera sin tareas de escritorio adicionales
d-i tasksel/first multiselect standard, ssh-server
d-i pkgsel/run_tasksel boolean false

# Finalizar la instalacion sin intervencion manual
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
