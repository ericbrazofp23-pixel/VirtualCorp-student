# VirtualCorp - Debian Server
# Arranque automatico UEFI

set default=0
set timeout=0

menuentry 'VirtualCorp Debian Server Auto Install' {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg debian-installer/locale=es_ES.UTF-8 ---
    initrd /install.amd/initrd.gz
}
